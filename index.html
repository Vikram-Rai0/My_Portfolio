<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Vikram Rai — Junior Full-Stack Developer</title>
    <meta
      name="description"
      content="Vikram Rai — junior full-stack developer building reliable web applications with React, Node.js, Express and MySQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vikram Rai — Junior Full-Stack Developer" />
    <meta
      property="og:description"
      content="Junior full-stack developer building reliable web applications with React, Node.js, Express and MySQL."
    />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var theme = null;
          try {
            theme = localStorage.getItem("portfolio-theme");
          } catch (e) {}
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var root = document.documentElement;
          if (theme === "dark") root.classList.add("dark");
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#111714" : "#ffffff");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
